packages:
  - .

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  msw: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - esbuild
  - msw

# Transitive packages pulled in below a patched release. Each entry is the fix
# for an advisory that `pnpm audit --audit-level high --prod` reports, and each is
# pinned inside its own major so no dependent sees a breaking change. Drop an
# entry once the parent package resolves the fixed version on its own.
overrides:
  # ReDoS via extglob (the 4.x copies in the tree are unaffected).
  picomatch@2: ^4.0.0
  # Arbitrary file read, and path traversal via a previous source map.
  postcss: ^8.5.18
  # DoS advisories (GHSA-q2hr-2g5m-vwhr and earlier), each fixed inside every
  # release line. Stay in-line: 5.x drops the default export that minimatch 3
  # (eslint's config-array) calls, which made eslint crash with "expand is not
  # a function".
  brace-expansion@1: ^1.1.22
  brace-expansion@2: ^2.1.8
  brace-expansion@5: ^5.0.13
  # Command injection in the glob CLI.
  glob@10: ^13.0.0
  # Code injection via _.template.
  lodash: ^4.17.24
  # ReDoS in matchOne() and in nested extglobs (3.x is unaffected).
  minimatch@9: ^11.0.0
  # Non-secure generators can loop indefinitely.
  nanoid@3: ^6.0.0
  # Several host-confusion/SSRF/path-traversal advisories in URI parsing.
  fast-uri@3: ^4.0.0
  # Three follow-redirects advisories (GHSA-q3jh-wrc6-jgq8, GHSA-8r9p-f939-6h3c, GHSA-mrwp-f3q8-3g9p).
  follow-redirects: ^1.16.2
  # zod 4 line only (GHSA-mrhx-c7xc-m3w5); zod 3 is a separate major and is left alone.
  zod@4: ^4.6.6
  # Four seroval advisories, fixed in 1.6.8.
  seroval: ^1.6.8
