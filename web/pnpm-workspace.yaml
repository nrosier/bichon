packages:
  - .

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  msw: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - esbuild
  - msw

# Transitive packages pulled in below a patched release. Each entry is the fix
# for an advisory that `pnpm audit --audit-level high --prod` reports, and each is
# pinned inside its own major so no dependent sees a breaking change. Drop an
# entry once the parent package resolves the fixed version on its own.
overrides:
  # ReDoS via extglob (the 4.x copies in the tree are unaffected).
  picomatch@2: ^4.0.0
  # Arbitrary file read, and path traversal via a previous source map.
  postcss: ^8.5.18
  # Three separate DoS advisories, one per release line present.
  brace-expansion@1: ^5.0.0
  brace-expansion@2: ^5.0.0
  # Command injection in the glob CLI.
  glob@10: ^13.0.0
  # Code injection via _.template.
  lodash: ^4.17.24
  # ReDoS in matchOne() and in nested extglobs (3.x is unaffected).
  minimatch@9: ^10.0.0
  # Non-secure generators can loop indefinitely.
  nanoid@3: ^6.0.0
  # Several host-confusion/SSRF/path-traversal advisories in URI parsing.
  fast-uri@3: ^4.0.0
