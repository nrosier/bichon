name: Release Bichon

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
env:
  BINARY_NAME: bichon-server
  BINARY_CLI: bichon-cli
  BINARY_ADMIN: bichon-admin
  IMAGE_NAME: bichon

permissions:
  contents: write

jobs:
  # Fails in seconds if the image would have nowhere to go, rather than after the
  # build and the GitHub release have already run. Kept in its own job so the
  # credentials are not in any build job's environment.
  preflight:
    name: Check Docker Hub credentials
    runs-on: ubuntu-latest
    steps:
      - name: Verify the secrets are set
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${DOCKERHUB_USERNAME:-}" ] || missing="DOCKERHUB_USERNAME"
          [ -n "${DOCKERHUB_TOKEN:-}" ] || missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Cargo.toml version matches git tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME}"

          CARGO_VERSION=$(grep '^version' Cargo.toml | head -n1 | cut -d '"' -f2)

          echo "Git tag version:    $TAG_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"

          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Version mismatch! Git tag ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi


      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Setup Node.js & pnpm
        uses: actions/setup-node@v7
        with:
          # Must stay >= 22.13: that is pnpm 11's declared engine floor, and the
          # install below fails outright on anything older.
          node-version: 24

      - name: Install pnpm
        # Pinned: pnpm 11 turned pending dependency build scripts into a hard
        # error, so an unpinned install can break a release without a commit.
        run: npm install -g pnpm@11

      - name: Build frontend (web)
        working-directory: ./web
        run: |
          pnpm install
          pnpm run build

      - name: Build Rust backend
        run: |
          cargo build --release --target=${{ matrix.target }}

      - name: Strip binary
        run: |
          strip target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}
          strip target/${{ matrix.target }}/release/${{ env.BINARY_CLI }}
          strip target/${{ matrix.target }}/release/${{ env.BINARY_ADMIN }}

      - name: Pack artifact
        shell: bash
        run: |
          mkdir -p release
          BINARY="target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}"
          cp README.md LICENSE release/
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} release/
          cp target/${{ matrix.target }}/release/${{ env.BINARY_CLI }} release/
          cp target/${{ matrix.target }}/release/${{ env.BINARY_ADMIN }} release/
          tar -czvf "${{ env.BINARY_NAME }}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" -C release .
          mv "${{ env.BINARY_NAME }}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" release/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release/${{ env.BINARY_NAME }}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*"
          merge-multiple: true
      
      - name: Flatten artifacts
        run: |
          mkdir -p artifacts
          find artifacts -type f -name "*.zip" -exec mv {} artifacts/ \;
          find artifacts -type f -name "*.tar.gz" -exec mv {} artifacts/ \;
      
      - name: Debug list files
        run: ls -R artifacts

      - name: Generate SHA256 checksums
        run: |
            cd artifacts
            sha256sum * > SHA256SUMS.txt
            cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            artifacts/*
  docker:
    name: Build, scan and push linux/amd64 image
    needs: [build, release]
    # Pinned to the release the image is built FROM, so the binaries link against
    # the same glibc they will run against.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: x86_64-unknown-linux-gnu
          path: artifacts

      - name: Extract the amd64 binaries
        run: |
          set -euo pipefail
          # The Dockerfile copies from <arch>/ so one context could serve several
          # architectures. Only amd64 is published.
          mkdir -p docker/amd64
          AMD64_FILE=$(ls artifacts | grep x86_64-unknown-linux-gnu.tar.gz)
          echo "Extracting $AMD64_FILE"
          tar -xzf "artifacts/$AMD64_FILE" -C docker/amd64
          ls -l docker/amd64

      # Ends up in an OCI label, so a running container can be traced back to the
      # moment it was built. The commit comes from github.sha.
      - name: Stamp the build
        id: stamp
        run: |
          set -euo pipefail
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image into the local daemon
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          platforms: linux/amd64
          # Into the daemon rather than the registry: the scan below decides
          # whether this image is ever published.
          load: true
          push: false
          no-cache: true
          tags: ${{ env.IMAGE_NAME }}:candidate
          build-args: |
            CRATE_VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILT_AT=${{ steps.stamp.outputs.built_at }}

      - name: Scan the image
        # This is the gate. A CRITICAL or HIGH with a fix available stops the
        # push, so a vulnerable image never reaches Docker Hub.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:candidate
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate the SBOM
        # From the same local image the scan just approved.
        # build-push-action's native `sbom: true` is deliberately not used: it
        # only attaches an attestation when buildx pushes the manifest itself,
        # which it does not here.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ env.IMAGE_NAME }}:candidate
          format: 'cyclonedx'
          output: 'sbom.cdx.json'

      - name: Upload the SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.ref_name }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

      # Only now do registry credentials enter this job's environment: every
      # third-party build and scan step above ran without them.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          repo="$DOCKERHUB_USERNAME/$IMAGE_NAME"
          docker tag "$IMAGE_NAME:candidate" "$repo:$TAG"
          docker push "$repo:$TAG"
          # A pre-release tag (2.0.1-rc1) must not become :latest.
          case "$TAG" in
            *-*) echo "Pre-release $TAG: leaving :latest alone" ;;
            *)
              docker tag "$IMAGE_NAME:candidate" "$repo:latest"
              docker push "$repo:latest"
              ;;
          esac
          echo "Pushed $repo:$TAG"
