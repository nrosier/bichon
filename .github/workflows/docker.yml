name: Docker Build and Push

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing in this workflow writes to the repository.
permissions:
  contents: read

env:
  IMAGE_NAME: bichon

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build, scan and push linux/amd64 (main)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Both values end up in OCI labels, so a running container can be traced
      # back to the exact commit and the moment it was built.
      - name: Stamp the build
        id: stamp
        run: |
          set -euo pipefail
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "version=$(grep '^version' Cargo.toml | head -n1 | cut -d '"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add x86_64-unknown-linux-musl
          rustup default stable
          cargo --version

      # Static linking against musl needs musl-gcc as the linker, since the
      # runner's own toolchain only targets glibc.
      - name: Install musl build tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools

      - name: Cache cargo registry and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-release-musl-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-release-musl-${{ runner.os }}-

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Must stay >= 22.13: that is pnpm 11's declared engine floor, and the
          # install below fails outright on anything older.
          node-version: 26

      - name: Install pnpm
        # Pinned: pnpm 11 turned pending dependency build scripts into a hard
        # error, so an unpinned install can break this workflow without a commit.
        run: npm install -g pnpm@11

      - name: Build the web UI
        working-directory: ./web
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build the release binaries
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Stage the binaries for the image
        run: |
          set -euo pipefail
          # The Dockerfile copies from <arch>/ so one context can serve several
          # architectures. Only amd64 is published.
          # `[profile.release] strip = true` in Cargo.toml already stripped these.
          mkdir -p docker/amd64
          for binary in bichon-server bichon-cli bichon-admin; do
            install -m 0755 "target/x86_64-unknown-linux-musl/release/$binary" "docker/amd64/$binary"
          done
          cp LICENSE docker/amd64/LICENSE
          cp -r third-party-licenses docker/amd64/third-party-licenses
          ls -l docker/amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image into the local daemon
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          platforms: linux/amd64
          # Into the daemon rather than the registry: the scan below decides
          # whether this image is ever published.
          load: true
          push: false
          no-cache: true
          tags: ${{ env.IMAGE_NAME }}:candidate
          build-args: |
            CRATE_VERSION=${{ steps.stamp.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILT_AT=${{ steps.stamp.outputs.built_at }}

      - name: Scan the image
        # This is the gate. A CRITICAL or HIGH with a fix available stops the
        # push, so a vulnerable image never reaches ghcr.io.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:candidate
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate the SBOM
        # From the same local image the scan just approved.
        # build-push-action's native `sbom: true` is deliberately not used: it
        # only attaches an attestation when buildx pushes the manifest itself,
        # which it does not here.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ env.IMAGE_NAME }}:candidate
          format: 'cyclonedx'
          output: 'sbom.cdx.json'

      - name: Upload the SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

      # Only now do registry credentials enter this job's environment: every
      # third-party build and scan step above ran without them.
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        env:
          IMAGE_REPO: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          repo="${IMAGE_REPO,,}"
          # `:latest` deliberately stays untouched here. It is published by
          # release.yml on a version tag and means "newest release"; if this
          # workflow claimed it too, the first commit after a release would
          # quietly replace the released image with an unreleased build for
          # everyone pulling the default tag. Main gets its own moving tag plus
          # an immutable per-commit one.
          short="${GITHUB_SHA:0:12}"
          docker tag "$IMAGE_NAME:candidate" "$repo:latest"
          docker tag "$IMAGE_NAME:candidate" "$repo:$short"
          docker push "$repo:latest"
          docker push "$repo:$short"
          echo "Pushed $repo:latest and $repo:$short"
